<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vitalis – Medications</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&amp;family=Share+Tech+Mono&amp;display=swap">
<style>
body{margin:0;background:#0B0E14}
a{color:#6FE3E1}a:hover{color:#A8F0EE}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: linear-gradient(180deg, #2B1719 0%, #1F1519 45%, #0F1520 100%); font-family: 'Rajdhani', 'Barlow Condensed', 'Arial Narrow', sans-serif; color: #D8E4E6; letter-spacing: 0.3px;">

<div aria-hidden="true" style="position: absolute; top: 0; left: 0; width: 390px; height: 844px; background: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 4px);"></div>
<div aria-hidden="true" style="position: absolute; left: 6px; top: 200px; width: 6px; height: 520px; background: repeating-linear-gradient(180deg, #8E3A3A 0px, #8E3A3A 1px, transparent 1px, transparent 8px);"></div>
<div aria-hidden="true" style="position: absolute; left: 4px; top: 200px; width: 12px; height: 520px; background: repeating-linear-gradient(180deg, #E0564F 0px, #E0564F 2px, transparent 2px, transparent 84px);"></div>
<div aria-hidden="true" style="position: absolute; right: 4px; top: 170px; width: 8px; height: 180px; background: repeating-linear-gradient(135deg, #B8433E 0px, #B8433E 3px, transparent 3px, transparent 7px);"></div>

<div style="position: relative; box-sizing: border-box; padding: 18px 20px 0 22px; display: flex; flex-direction: column; gap: 10px;">

<div style="display: flex; align-items: center; gap: 12px; height: 44px;">
<span lang="ja" style="font-size: 22px; font-weight: 600; color: #D8E4E6;">薬</span>
<span aria-hidden="true" style="flex-grow: 1; display: flex; align-items: center; gap: 4px; color: #E0564F; font-size: 22px; font-weight: 500;">[<svg width="100%" height="24" viewBox="0 0 200 24" preserveAspectRatio="none" fill="none"><polyline points="0,12 70,12 78,12 84,5 90,19 96,2 102,22 108,12 200,12" stroke="{{accent}}" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline></svg>]</span>
<button type="button" aria-label="Add a medication" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; background: {{accent}}; color: #1A0F11; display: flex; align-items: center; justify-content: center; cursor: pointer; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M12 4v16M4 12h16"></path></svg></button>
</div>

<div style="display: flex; flex-direction: column; gap: 4px;">
<span style="font-family: 'Share Tech Mono', Consolas, monospace; font-size: 10px; color: #E0564F;">VITALIS // DOSE_PROTOCOL V2.6 // ACTIVE</span>
<h1 style="margin: 0; font-size: 38px; font-weight: 700; line-height: 1; letter-spacing: 1px; color: {{accent}};">MEDICATIONS</h1>
</div>

<div style="position: relative; box-sizing: border-box; padding: 20px 16px 14px; display: flex; flex-direction: column; gap: 10px;">
<span aria-hidden="true" style="position: absolute; top: 0; left: 0; width: 14px; height: 14px; border-top: 2px solid #B8433E; border-left: 2px solid #B8433E;"></span>
<span aria-hidden="true" style="position: absolute; top: 0; right: 0; width: 14px; height: 14px; border-top: 2px solid #B8433E; border-right: 2px solid #B8433E;"></span>
<span aria-hidden="true" style="position: absolute; bottom: 0; left: 0; width: 14px; height: 14px; border-bottom: 2px solid #B8433E; border-left: 2px solid #B8433E;"></span>
<span aria-hidden="true" style="position: absolute; bottom: 0; right: 0; width: 14px; height: 14px; border-bottom: 2px solid #B8433E; border-right: 2px solid #B8433E;"></span>
<span style="position: absolute; top: 4px; left: 20px; font-family: 'Share Tech Mono', Consolas, monospace; font-size: 10px; color: #E0564F;">TODAY // 21.09</span>

<div style="display: flex; align-items: flex-end; gap: 14px;">
<span style="font-size: 54px; font-weight: 700; line-height: 0.9; color: {{accent}};">{{countText}}</span>
<span style="display: flex; flex-direction: column; line-height: 1.1; padding-bottom: 2px;"><span style="font-size: 18px; font-weight: 700; color: #D8E4E6;">DOSES LOGGED</span><span style="font-family: 'Share Tech Mono', Consolas, monospace; font-size: 11px; color: #E0564F;">{{nextText}}</span></span>
</div>

<div style="border: 1.5px solid #B8433E; display: flex; flex-direction: column;">
<span aria-hidden="true" style="height: 16px; margin: 3px; width: {{pctWidth}}; background: repeating-linear-gradient(90deg, {{accent}} 0px, {{accent}} 2px, transparent 2px, transparent 4px);"></span>
<div style="display: flex; align-items: stretch; border-top: 1.5px solid #B8433E; height: 28px;">
<span style="width: 70px; box-sizing: border-box; border-right: 1.5px solid #B8433E; padding: 2px 5px; font-family: 'Share Tech Mono', Consolas, monospace; font-size: 8px; line-height: 1.2; color: #C49490;">DOSE PROTOCOL</span>
<span style="flex-grow: 1; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: {{accent}};">{{pctText}}</span>
<span style="width: 60px; box-sizing: border-box; border-left: 1.5px solid #B8433E; padding: 2px 5px; font-family: 'Share Tech Mono', Consolas, monospace; font-size: 8px; line-height: 1.2; color: #C49490;">CYCLE 21 REV 09</span>
</div>
</div>
</div>

<div style="display: flex; align-items: center; gap: 8px; margin-top: 2px;">
<span style="background: {{accent}}; color: #1A0F11; padding: 1px 8px; font-size: 15px; font-weight: 700;">0800</span>
<span style="font-size: 16px; font-weight: 700; color: #D8E4E6; letter-spacing: 1px;">MORNING</span>
<span aria-hidden="true" style="flex-grow: 1; height: 1px; background: #8E3A3A;"></span>
</div>
<sc-for list="{{morning}}" as="d" hint-placeholder-count="2">
<div style="height: 64px; box-sizing: border-box; padding: 0 10px 0 12px; display: flex; align-items: center; gap: 12px; background: #22313A; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);">
<span style="width: 38px; height: 38px; flex-shrink: 0; box-sizing: border-box; border: 1.5px solid {{d.color}}; color: {{d.color}}; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-45 12 12)"></rect><path d="M9.2 9.2l5.6 5.6"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; line-height: 1.1;"><span style="font-size: 19px; font-weight: 700;">{{d.name}}</span><span style="font-family: 'Share Tech Mono', Consolas, monospace; font-size: 11px; color: #9FB3B8;">{{d.detail}}</span></span>
<button type="button" onClick="{{d.toggle}}" aria-pressed="{{d.pressed}}" style="min-width: 88px; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid {{accent}}; font-family: inherit; font-size: 16px; font-weight: 700; letter-spacing: 1px; cursor: pointer; background: {{d.btnBg}}; color: {{d.btnColor}};">{{d.btnLabel}}</button>
</div>
</sc-for>

<div style="display: flex; align-items: center; gap: 8px; margin-top: 2px;">
<span style="background: {{accent}}; color: #1A0F11; padding: 1px 8px; font-size: 15px; font-weight: 700;">2000</span>
<span style="font-size: 16px; font-weight: 700; color: #D8E4E6; letter-spacing: 1px;">EVENING</span>
<span aria-hidden="true" style="flex-grow: 1; height: 1px; background: #8E3A3A;"></span>
</div>
<sc-for list="{{evening}}" as="d" hint-placeholder-count="1">
<div style="height: 64px; box-sizing: border-box; padding: 0 10px 0 12px; display: flex; align-items: center; gap: 12px; background: #22313A; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);">
<span style="width: 38px; height: 38px; flex-shrink: 0; box-sizing: border-box; border: 1.5px solid {{d.color}}; color: {{d.color}}; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-45 12 12)"></rect><path d="M9.2 9.2l5.6 5.6"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; line-height: 1.1;"><span style="font-size: 19px; font-weight: 700;">{{d.name}}</span><span style="font-family: 'Share Tech Mono', Consolas, monospace; font-size: 11px; color: #9FB3B8;">{{d.detail}}</span></span>
<button type="button" onClick="{{d.toggle}}" aria-pressed="{{d.pressed}}" style="min-width: 88px; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid {{accent}}; font-family: inherit; font-size: 16px; font-weight: 700; letter-spacing: 1px; cursor: pointer; background: {{d.btnBg}}; color: {{d.btnColor}};">{{d.btnLabel}}</button>
</div>
</sc-for>

<button type="button" style="position: relative; margin-top: 6px; height: 50px; box-sizing: border-box; padding: 4px 22px 4px 14px; display: flex; align-items: center; gap: 12px; border: 0; background: #E0625A; color: #1A0F11; font-family: inherit; cursor: pointer; clip-path: polygon(0 0, 100% 0, 100% 100%, 16px 100%, 0 calc(100% - 16px));">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M12 4v16M4 12h16"></path></svg>
<span style="flex-grow: 1; display: flex; flex-direction: column; align-items: flex-start; line-height: 1;"><span style="font-size: 19px; font-weight: 700;">LOG AS-NEEDED DOSE</span><span style="font-size: 9px; font-weight: 700; margin-top: 3px;">MANUAL OVERRIDE</span></span>
<span aria-hidden="true" style="position: absolute; top: 4px; right: 4px; width: 9px; height: 9px; background: #1A0F11; clip-path: polygon(0 0, 100% 0, 100% 100%);"></span>
</button>

</div>

<nav aria-label="Main" style="position: absolute; left: 14px; right: 14px; bottom: 18px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding-top: 8px; border-top: 1.5px solid #8E3A3A;">
<a href="Main.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: #22313A; color: #D8E4E6; text-decoration: none; font-size: 14px; font-weight: 700; letter-spacing: 1px; clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>VITALS</a>
<a href="Records.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: #22313A; color: #D8E4E6; text-decoration: none; font-size: 14px; font-weight: 700; letter-spacing: 1px; clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l4 4v14H7z"></path><path d="M14 3v4h4M10 12h5M10 16h5"></path></svg>RECORDS</a>
<a href="Medications.dc.html" aria-current="page" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: {{accent}}; color: #1A0F11; text-decoration: none; font-size: 14px; font-weight: 700; letter-spacing: 1px; clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-45 12 12)"></rect><path d="M9.2 9.2l5.6 5.6"></path></svg>MEDS</a>
<a href="MedicalID.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: #22313A; color: #D8E4E6; text-decoration: none; font-size: 14px; font-weight: 700; letter-spacing: 1px; clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 4v16M5.1 8l13.8 8M5.1 16l13.8-8"></path></svg>MED ID</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6FE3E1","options":["#6FE3E1","#F0605A","#F2D35B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#6FE3E1';
    const taken = (this.state && this.state.taken) || { vitd: true, cet: true, omega: false };
    const doses = [
      { id: 'vitd', slot: 'morning', time: '0800', name: 'VITAMIN D3', detail: '1 CAPSULE // 1,000 IU', color: '#F2B35B' },
      { id: 'cet', slot: 'morning', time: '0800', name: 'CETIRIZINE', detail: '1 TABLET // 10 MG', color: '#B79CF5' },
      { id: 'omega', slot: 'evening', time: '2000', name: 'OMEGA-3', detail: '2 CAPSULES // 1,000 MG', color: '#6FB8F0' }
    ].map((d) => {
      const isTaken = !!taken[d.id];
      return Object.assign({}, d, {
        taken: isTaken,
        pressed: isTaken ? 'true' : 'false',
        btnLabel: isTaken ? 'LOGGED' : 'LOG',
        btnBg: isTaken ? accent : 'transparent',
        btnColor: isTaken ? '#1A0F11' : accent,
        toggle: () => {
          const next = Object.assign({}, taken);
          next[d.id] = !isTaken;
          this.setState({ taken: next });
        }
      });
    });
    const count = doses.filter((d) => d.taken).length;
    const pct = Math.round(count / doses.length * 100);
    const pending = doses.find((d) => !d.taken);
    return {
      accent: accent,
      morning: doses.filter((d) => d.slot === 'morning'),
      evening: doses.filter((d) => d.slot === 'evening'),
      countText: count + '/' + doses.length,
      nextText: pending ? 'NEXT: ' + pending.name + ' // ' + pending.time : 'ALL DOSES LOGGED // PROTOCOL COMPLETE',
      pctText: 'COMPLIANCE ' + pct + '%',
      pctWidth: 'max(0px, calc(' + pct + '% - 6px))'
    };
  }
}
</script>
</body>
</html>
